name: FA Fertigung Hybrid AI FIX7 OCR

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Projekt entpacken
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q FA_Fertigung_Projekt_HYBRID_KI_FIX7_OCR.zip -d android-project

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: APK bauen
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p release
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release/FA-Fertigung-Hybrid-KI-FIX7-OCR.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-Hybrid-KI-FIX7-OCR
          path: release/FA-Fertigung-Hybrid-KI-FIX7-OCR.apk
          retention-days: 90
