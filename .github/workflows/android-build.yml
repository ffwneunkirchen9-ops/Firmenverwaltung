name: FA Fertigung FIX52.10 Uhr
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -q FA_Fertigung_Android_FIX52_10_Stundenkonto.zip -d android-project
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Signierschlüssel
        env:
          FA_KEYSTORE_BASE64: ${{ secrets.FA_KEYSTORE_BASE64 }}
        run: |
          test -n "$FA_KEYSTORE_BASE64"
          printf '%s' "$FA_KEYSTORE_BASE64" | base64 --decode > android-project/fa-fertigung-release.jks
      - name: Watch-APK bauen
        working-directory: android-project
        env:
          FA_KEYSTORE_PATH: ${{ github.workspace }}/android-project/fa-fertigung-release.jks
          FA_KEYSTORE_PASSWORD: ${{ secrets.FA_KEYSTORE_PASSWORD }}
          FA_KEY_ALIAS: ${{ secrets.FA_KEY_ALIAS }}
          FA_KEY_PASSWORD: ${{ secrets.FA_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :wear:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-FIX52-10-UHR
          path: android-project/wear/build/outputs/apk/release/wear-release.apk
