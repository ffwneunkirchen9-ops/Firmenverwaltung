name: FA Fertigung FIX50.3 Handy

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: FIX50.3-Projekt entpacken
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ZIP='FA_Fertigung_Android_FIX50_3_Einrichteplaene_Rettung.zip'
          if [[ ! -f "$PROJECT_ZIP" ]]; then
            echo "FEHLER: $PROJECT_ZIP fehlt im GitHub-Hauptverzeichnis."
            exit 1
          fi
          echo "Verwende Projektdatei: $PROJECT_ZIP"
          mkdir -p android-project
          unzip -q "$PROJECT_ZIP" -d android-project
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vorhandenen Signierschlüssel bereitstellen
        shell: bash
        env:
          FA_KEYSTORE_BASE64: ${{ secrets.FA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FA_KEYSTORE_BASE64" || { echo 'FA_KEYSTORE_BASE64 fehlt'; exit 1; }
          printf '%s' "$FA_KEYSTORE_BASE64" | base64 --decode > android-project/fa-fertigung-release.jks

      - name: Handy Release APK bauen
        working-directory: android-project
        env:
          FA_KEYSTORE_PATH: ${{ github.workspace }}/android-project/fa-fertigung-release.jks
          FA_KEYSTORE_PASSWORD: ${{ secrets.FA_KEYSTORE_PASSWORD }}
          FA_KEY_ALIAS: ${{ secrets.FA_KEY_ALIAS }}
          FA_KEY_PASSWORD: ${{ secrets.FA_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Handy APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-FIX50-3-HANDY
          path: android-project/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
