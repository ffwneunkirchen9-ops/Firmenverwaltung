name: FA Fertigung Hybrid AI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Projekt entpacken
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q FA_Fertigung_Projekt_HYBRID_KI.zip -d android-project

      - name: Projekt korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Kotlin 2.3 JVM-DSL
          gradle = Path("android-project/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")

          if "org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n' + text

          text = re.sub(
              r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}\s*\n',
              '\n',
              text,
              flags=re.S
          )

          if "compilerOptions" not in text:
              text = text.replace(
                  "\n\ndependencies {",
                  """

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {""",
                  1
              )

          gradle.write_text(text, encoding="utf-8")

          # LocalAiBridge-Kompatibilität
          bridge = Path(
              "android-project/app/src/main/java/de/fa/fertigung/ai/LocalAiBridge.kt"
          )
          text = bridge.read_text(encoding="utf-8")

          text = text.replace(
              """    private fun evaluate(script: String) {
                  webView.post {
                      if (!webView.isDestroyed) {
                          webView.evaluateJavascript(script, null)
                      }
                  }
              }""",
              """    private fun evaluate(script: String) {
                  webView.post {
                      runCatching {
                          webView.evaluateJavascript(script, null)
                      }
                  }
              }"""
          )

          bridge.write_text(text, encoding="utf-8")

          # Android-/Samsung-Leiste automatisch ausblenden
          main = Path(
              "android-project/app/src/main/java/de/fa/fertigung/MainActivity.kt"
          )
          text = main.read_text(encoding="utf-8")

          if "import android.os.Build" not in text:
              text = text.replace(
                  "import android.os.Bundle\n",
                  "import android.os.Bundle\nimport android.os.Build\n"
              )

          if "import android.view.WindowInsets" not in text:
              text = text.replace(
                  "import android.provider.MediaStore\n",
                  "import android.provider.MediaStore\n"
                  "import android.view.View\n"
                  "import android.view.WindowInsets\n"
                  "import android.view.WindowInsetsController\n"
              )

          if "private fun hideNavigationBar()" not in text:
              text = text.replace(
                  """        webView.loadUrl(
                      WEB_APP_URL
                  )
              }""",
                  """        webView.loadUrl(
                      WEB_APP_URL
                  )

                  hideNavigationBar()
              }"""
              )

              text = text.replace(
                  """    private fun createCameraIntent(): Pair<Intent, Uri>? {""",
                  """    private fun hideNavigationBar() {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.R
                  ) {

                      window.insetsController?.let {
                          controller ->

                          controller.hide(
                              WindowInsets.Type.navigationBars()
                          )

                          controller.systemBarsBehavior =
                              WindowInsetsController
                                  .BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }

                  } else {

                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility =
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE

                  }
              }


              override fun onResume() {
                  super.onResume()

                  webView.postDelayed(
                      {
                          hideNavigationBar()
                      },
                      250
                  )
              }


              override fun onWindowFocusChanged(
                  hasFocus: Boolean
              ) {
                  super.onWindowFocusChanged(
                      hasFocus
                  )

                  if (hasFocus) {

                      webView.postDelayed(
                          {
                              hideNavigationBar()
                          },
                          150
                      )

                  }
              }


              private fun createCameraIntent(): Pair<Intent, Uri>? {"""
              )

          main.write_text(text, encoding="utf-8")
          PY

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: APK bauen
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p release
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release/FA-Fertigung-Hybrid-KI.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-Hybrid-KI
          path: release/FA-Fertigung-Hybrid-KI.apk
          retention-days: 90
