name: FA Fertigung FIX34 Phone + Watch

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Projekt entpacken
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q FA_Fertigung_Projekt_FIX34_TIMER_SICHTBAR.zip -d android-project

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Signierschlüssel bereitstellen
        shell: bash
        env:
          FA_KEYSTORE_BASE64: ${{ secrets.FA_KEYSTORE_BASE64 }}
        run: |
          test -n "$FA_KEYSTORE_BASE64" || { echo "FA_KEYSTORE_BASE64 fehlt"; exit 1; }
          printf '%s' "$FA_KEYSTORE_BASE64" | base64 --decode > android-project/fa-fertigung-release.jks

      - name: Phone und Watch Release APK bauen
        working-directory: android-project
        env:
          FA_KEYSTORE_PATH: ${{ github.workspace }}/android-project/fa-fertigung-release.jks
          FA_KEYSTORE_PASSWORD: ${{ secrets.FA_KEYSTORE_PASSWORD }}
          FA_KEY_ALIAS: ${{ secrets.FA_KEY_ALIAS }}
          FA_KEY_PASSWORD: ${{ secrets.FA_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          gradle --no-daemon :app:assembleRelease :wear:assembleRelease --stacktrace

      - name: APKs umbenennen
        run: |
          mkdir -p release
          cp android-project/app/build/outputs/apk/release/app-release.apk release/FA-Fertigung-FIX34-PHONE.apk
          cp android-project/wear/build/outputs/apk/release/wear-release.apk release/FA-Fertigung-FIX34-WATCH.apk

      - name: Phone APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-FIX34-PHONE
          path: release/FA-Fertigung-FIX34-PHONE.apk
          retention-days: 90

      - name: Watch APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-FIX34-WATCH
          path: release/FA-Fertigung-FIX34-WATCH.apk
          retention-days: 90
