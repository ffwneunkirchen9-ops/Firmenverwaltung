name: FA Fertigung Hybrid AI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Projekt entpacken
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -q FA_Fertigung_Projekt_HYBRID_KI.zip -d android-project

      - name: Kotlin 2.3 JVM-Ziel korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android-project/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          if "org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in text:
              text = 'import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n' + text

          text = re.sub(
              r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}\s*\n',
              '\n',
              text,
              flags=re.S
          )

          if "compilerOptions" not in text:
              text = text.replace(
                  "\n\ndependencies {",
                  """

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }

          dependencies {""",
                  1
              )

          p.write_text(text, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: APK bauen
        working-directory: android-project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p release
          cp android-project/app/build/outputs/apk/debug/app-debug.apk release/FA-Fertigung-Hybrid-KI.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FA-Fertigung-Hybrid-KI
          path: release/FA-Fertigung-Hybrid-KI.apk
          retention-days: 90
